name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Test suites
        run: |
          set -e
          for f in tests/test_*.py; do
            echo "== $f =="
            python3 "$f"
          done
      - name: Repo self-checks (dure-doctor + dure-audit + dure-survey must pass)
        run: |
          set -e
          python3 scripts/dure-doctor.py
          python3 scripts/dure-audit.py
          survey_out=$(python3 scripts/dure-survey.py)   # set -e catches a non-zero exit
          echo "$survey_out" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['counts']['findings']==0, d['counts']; print('dure-survey: 0 findings')"
